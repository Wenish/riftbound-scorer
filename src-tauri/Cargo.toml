[package]
name = "riftbound-scorer"
version = "0.1.0"
description = "Offline 1v1 score and match timer for Riftbound"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name clash with the binary crate on Windows.
name = "riftbound_scorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5" }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
